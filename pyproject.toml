[project]
name = "telegram-bot-template"
version = "2.4.0"
description = "Best way to create a scalable telegram bot with analytics"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "donbarbos", email = "donbarbos@proton.me"},
]
package-mode = false
requires-python = ">=3.14,<4.0"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.52,<3.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
]

[project.urls]
homepage = "https://github.com/donbarbos/telegram-bot-template"
repository = "https://github.com/donbarbos/telegram-bot-template"

[dependency-groups]
bot = [
    "aiogram>=3.30.0,<4.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "redis>=8.1.0,<9.0.0",
    "loguru>=0.7.3,<1.0.0",
    "sentry-sdk[loguru]>=2.68.0,<3.0.0",
    "aiohttp[speedups]>=3.14.3,<4.0.0",
    "uvloop>=0.21.0,<1.0.0",
    "babel>=2.17.0,<3.0.0",
    "orjson>=3.12.0,<4.0.0",
    "alembic>=1.19.1,<2.0.0",
    "prometheus-client>=0.26.0,<1.0.0",
    "dishka>=1.10.1,<2.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn[standard]>=0.52.4,<1.0.0",
    "taskiq>=0.12.5,<1.0.0",
    "taskiq-redis>=1.2.3,<2.0.0",
]
admin = [
    "gunicorn>=26.0.0,<27.0.0",
    "flask>=3.1.0,<4.0.0",
    "flask-admin>=2.2.0,<3.0.0",
    "flask-security-too>=5.8.1,<6.0.0",
    "flask-caching>=2.4.0,<3.0.0",
    "flask-babel>=4.0.0,<5.0.0",
    "flask-sqlalchemy>=3.1.1,<4.0.0",
    "psycopg2-binary>=2.9.12,<3.0.0",
    "tablib[xlsx]>=3.9.0,<4.0.0",
]
dev = [
    "ruff>=0.16.4,<1.0.0",
    "mypy>=2.3.1,<3.0.0",
    "pre-commit>=4.6.2,<5.0.0",
]

[tool.ruff]
fix = true
unsafe-fixes = false
line-length = 120
lint.select = ["ALL"]
lint.ignore = ["D", "ANN401", "FIX002", "COM812", "ISC001", "FBT001", "FBT002", "ERA", "ARG005", "PGH003", "A005", "CPY"]
cache-dir = "/tmp/ruff-cache/"
extend-exclude = ["logs", "configs", "migrations", "docs"]

[tool.ruff.lint.flake8-type-checking]
# These base classes have their annotations evaluated at runtime (aiogram
# resolves filter and middleware signatures via get_type_hints, pydantic builds
# validators from them). Without this, ruff's TC00x autofix moves the imports
# into `if TYPE_CHECKING:` and the annotations raise NameError at runtime.
runtime-evaluated-base-classes = [
    "aiogram.filters.BaseFilter",
    "aiogram.BaseMiddleware",
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

[tool.ruff.lint.isort]
no-lines-before = ["future", "standard-library"]
known-local-folder = ["bot", "admin"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["ANN401", "S101", "S311"]

[tool.mypy]
python_version = "3.14"
files = "bot"
plugins = ["pydantic.mypy"]
ignore_missing_imports = false
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
show_error_context = true
pretty = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
follow_imports_for_stubs = true
namespace_packages = true
show_absolute_path = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
